<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#153d32" />
    <meta name="description" content="BeanGuard AI bean-leaf disease monitoring and classification." />
    <title>BeanGuard AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="BeanGuard AI home">
        <span class="brand-mark">B</span>
        <span>BeanGuard <span class="brand-light">AI</span><small>FIELD INTELLIGENCE</small></span>
      </a>
      <div class="top-actions">
        <span id="health-pill" class="health-pill"><i></i>Connecting</span>
        <span id="account-area"></span>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <span class="eyebrow side-label">WORKSPACE</span>
        <button class="nav-item selected" data-tab="overview">Overview</button>
        <button class="nav-item" data-tab="predict">Image prediction</button>
        <button class="nav-item" data-tab="insights">Data insights</button>
        <button class="nav-item" data-tab="retrain">Upload &amp; retrain</button>
        <div id="model-label" class="sidebar-foot"></div>
      </aside>
      <main class="content">
        <div id="page"></div>
        <footer class="footer">
          <span>BEANGUARD AI · MACHINE LEARNING CYCLE</span>
          <span>Predictions are estimates; verify important decisions with an agronomist.</span>
        </footer>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
