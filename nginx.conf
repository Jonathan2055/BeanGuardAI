server {
    listen 80;
    client_max_body_size 300m;          # zip uploads

    # Docker's DNS returns the address of every "api" container.
    # A variable makes nginx look it up again, so --scale works without restarting nginx.
    resolver 127.0.0.11 valid=5s;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
